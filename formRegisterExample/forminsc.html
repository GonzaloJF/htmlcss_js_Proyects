<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form>
      <div class="input">
        <label>username:</label>
        <input
          type="text"
          name="username"
          id="username"
          placeholder=" User name "
        />
      </div>
      <div class="input">
        <label>Email:</label>
        <input
          type="email"
          name="email"
          id="email"
          placeholder="user@example.com"
        />
      </div>
      <div class="input">
        <label>password:</label>
        <input type="password" name="password" id="password" />
      </div>
      <div class="button">
        <button type="submit" id="registerbtn" onclick="Register()">
          Register
        </button>
      </div>
    </form>
    <script src="data.js"></script>
  </body>
</html>
